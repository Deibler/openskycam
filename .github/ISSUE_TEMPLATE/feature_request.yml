name: Feature request
description: Suggest something openskycam should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you want to do
      description: The problem or the task, not the solution yet.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: How it could work
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today instead
  - type: dropdown
    id: part
    attributes:
      label: Part
      options:
        - Setup
        - Website
        - API or MCP server
        - Recording (relay, ingest, store)
        - Processor, workflows or models
        - Documentation
        - Something else
